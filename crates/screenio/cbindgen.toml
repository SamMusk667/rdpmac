# Generates include/screenio.h; run scripts/header.sh.
language = "C"
include_guard = "SCREENIO_H"
cpp_compat = true
style = "both"
documentation = true
documentation_style = "c99"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
header = """/* screenio: screen capture, cursor state and input injection.
 * All functions are synchronous. They return SIO_OK or a negative SIO_E_* code.
 * C ABI 1.0: see "C ABI" in README.md for what later versions may and may not change. */"""
autogen_warning = "/* Generated by cbindgen from crates/screenio/src/lib.rs; edit that file and run scripts/header.sh. */"

[export]
include = ["sio_display_t", "sio_frame_t", "sio_cursor_shape_t", "sio_session_info_t"]

[fn]
sort_by = "None"

[const]
sort_by = "None"
