[package]
name = "screenio"
# Versioned apart from rdpmac: the C ABI has its own compatibility rules (docs/libscreenio.md).
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "C ABI for screenio-core, built as libscreenio (dylib, so, dll and static)"

[lib]
name = "screenio"
crate-type = ["cdylib", "staticlib"]

[dependencies]
screenio-core = { path = "../screenio-core" }
