[package]
name = "rdpmac-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "IronRDP display and input handlers backed by libscreenio"

[dependencies]
screenio-core.workspace = true
rdpmac-encode = { path = "../rdpmac-encode" }
ironrdp-server.workspace = true
ironrdp-pdu.workspace = true
ironrdp-displaycontrol.workspace = true
ironrdp-egfx.workspace = true
ironrdp-dvc.workspace = true
ironrdp-svc.workspace = true
ironrdp-cliprdr.workspace = true
ironrdp-rdpsnd.workspace = true
ironrdp-rdpdr.workspace = true
ironrdp-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
anyhow.workspace = true
bytes.workspace = true
nfsserve.workspace = true
libc.workspace = true

[dev-dependencies]
# Paused time, for the timeout of drive requests.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
