[package]
name = "screenio-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Screen capture, cursor state and input injection behind one small API; macOS first, stubs elsewhere"

[lib]
name = "screenio_core"

[dependencies]
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSColor",
    "NSCursor",
    "NSEvent",
    "NSImage",
    "NSImageRep",
    "NSWorkspace",
    "objc2-core-foundation",
] }
objc2-core-foundation = "0.3"
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMSampleBuffer",
    "CMTime",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "SCError",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
