[workspace]
resolver = "2"
members = [
    "crates/rdpmac-auth",
    "crates/rdpmac-encode",
    "crates/rdpmac-session",
    "crates/rdpmacd",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# libscreenio has no remote yet; switch to a git dependency pinned to a tag once it does (ADR-0001 D6).
screenio-core = { path = "../libscreenio/crates/screenio-core" }
ironrdp-server = { version = "0.13", default-features = false, features = ["rayon", "helper", "egfx"] }
ironrdp-pdu = "0.9"
# Same minor as ironrdp-server 0.13 uses, so the layout type in RdpServerDisplay::request_layout unifies.
ironrdp-displaycontrol = "0.8"
ironrdp-egfx = "0.3"
ironrdp-dvc = "0.8"
ironrdp-svc = "0.8"
ironrdp-cliprdr = "0.7"
ironrdp-core = "0.2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
async-trait = "0.1"
anyhow = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
rcgen = "0.14"
directories = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha1 = "0.11"
sha2 = "0.11"

# NLA needs patched ironrdp-acceptor and ironrdp-server (docs/nla.md). The patch lives on branch rdpmac/nla
# of a local IronRDP checkout, started from the commit the published crates were built from; every IronRDP
# crate comes from there so their types stay one set.
[patch.crates-io]
ironrdp-acceptor = { path = "../IronRDP/crates/ironrdp-acceptor" }
ironrdp-ainput = { path = "../IronRDP/crates/ironrdp-ainput" }
ironrdp-async = { path = "../IronRDP/crates/ironrdp-async" }
ironrdp-cliprdr = { path = "../IronRDP/crates/ironrdp-cliprdr" }
ironrdp-connector = { path = "../IronRDP/crates/ironrdp-connector" }
ironrdp-core = { path = "../IronRDP/crates/ironrdp-core" }
ironrdp-displaycontrol = { path = "../IronRDP/crates/ironrdp-displaycontrol" }
ironrdp-dvc = { path = "../IronRDP/crates/ironrdp-dvc" }
ironrdp-echo = { path = "../IronRDP/crates/ironrdp-echo" }
ironrdp-egfx = { path = "../IronRDP/crates/ironrdp-egfx" }
ironrdp-error = { path = "../IronRDP/crates/ironrdp-error" }
ironrdp-graphics = { path = "../IronRDP/crates/ironrdp-graphics" }
ironrdp-pdu = { path = "../IronRDP/crates/ironrdp-pdu" }
ironrdp-rdpsnd = { path = "../IronRDP/crates/ironrdp-rdpsnd" }
ironrdp-server = { path = "../IronRDP/crates/ironrdp-server" }
ironrdp-svc = { path = "../IronRDP/crates/ironrdp-svc" }
ironrdp-tokio = { path = "../IronRDP/crates/ironrdp-tokio" }
