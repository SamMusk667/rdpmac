[workspace]
resolver = "2"
members = [
    "crates/rdpmac-auth",
    "crates/rdpmac-encode",
    "crates/rdpmac-session",
    "crates/rdpmacd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# libscreenio has no remote yet; switch to a git dependency pinned to a tag once it does (ADR-0001 D6).
screenio-core = { path = "../libscreenio/crates/screenio-core" }
ironrdp-server = { version = "0.13", default-features = false, features = ["rayon", "helper", "egfx"] }
ironrdp-pdu = "0.9"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
async-trait = "0.1"
anyhow = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rcgen = "0.14"
directories = "6"
libc = "0.2"
